name: Relais IA

# Déploie le relais IA sur Cloudflare à chaque modification de relais/,
# puis branche le site sur l'adresse du relais (config.js).
on:
  push:
    branches: [main]
    paths: ['relais/**', '.github/workflows/relais.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relais-ia
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IA_CLE: ${{ secrets.IA_CLE }}
      NOTION_CLE: ${{ secrets.NOTION_CLE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests du relais
        working-directory: relais
        run: npm test

      - name: Secrets Cloudflare présents ?
        id: verif
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "pret=true" >> "$GITHUB_OUTPUT"
          else
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ajoute les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions), puis relance ce workflow."
          fi

      - name: Déployer sur Cloudflare
        id: deploy
        if: steps.verif.outputs.pret == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relais
          command: deploy

      - name: Clé du fournisseur (seulement hors Cloudflare)
        if: steps.verif.outputs.pret == 'true' && env.IA_CLE != ''
        working-directory: relais
        run: printf '%s' "$IA_CLE" | npx --yes wrangler@4 secret put IA_CLE

      - name: Clé Notion (pour les mises à jour confirmées par Geri)
        if: steps.verif.outputs.pret == 'true' && env.NOTION_CLE != ''
        working-directory: relais
        run: printf '%s' "$NOTION_CLE" | npx --yes wrangler@4 secret put NOTION_CLE

      - name: Brancher le site sur le relais
        if: steps.verif.outputs.pret == 'true'
        env:
          URL_DEPLOYEE: ${{ steps.deploy.outputs.deployment-url }}
          SORTIE: ${{ steps.deploy.outputs.command-output }}
        run: |
          URL="${URL_DEPLOYEE:-$(printf '%s' "$SORTIE" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)}"
          URL="${URL%/}"
          if [ -z "$URL" ]; then
            echo "::warning::Adresse du relais introuvable dans la sortie de wrangler : renseigne-la à la main dans config.js."
            exit 0
          fi
          echo "Relais : $URL"
          curl -fsS --max-time 20 "$URL/" || echo "::notice::Le relais ne répond pas encore (propagation workers.dev, quelques minutes)."
          sed -i -E "s#^([[:space:]]*relais:[[:space:]]*)'[^']*'#\1'${URL}'#" config.js
          if git diff --quiet -- config.js; then echo "config.js déjà à jour."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "Assistant : branchement sur le relais ${URL}"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
