# Relais IA du tableau de pilotage (Cloudflare Worker).
# Le site parle à ce relais ; le relais parle au modèle. Aucune clé n'est dans le navigateur.

name = "larmina-ia"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Accès à Workers AI (modèles hébergés par Cloudflare, quota gratuit de 10 000 neurones par jour).
[ai]
binding = "AI"

[vars]
# ─────────────────────────────────────────────────────────────────────────────
#  CHANGER DE MODÈLE : modifier IA_FOURNISSEUR (et IA_MODELE si besoin), pousser.
#  cloudflare | anthropic | openai | mistral | groq | gemini | openrouter | compatible
#  Tous sauf « cloudflare » demandent la clé du fournisseur dans le secret GitHub IA_CLE.
# ─────────────────────────────────────────────────────────────────────────────
IA_FOURNISSEUR = "cloudflare"
# Vide = modèle par défaut du fournisseur (voir src/fournisseurs.js).
IA_MODELE = ""
# Modèle appelé si le principal répond de travers (raisonnement qui fuit, anglais).
# Vide = secours par défaut (Cloudflare : Mistral Small 3.1) ; « aucun » = pas de secours.
IA_MODELE_SECOURS = ""
# Seulement pour « compatible » : adresse complète …/v1/chat/completions.
IA_URL = ""
# Plafond de jetons générés par réponse.
MAX_TOKENS = "1200"

# Notion : base « Projets » où Geri enregistre les décisions confirmées.
# La clé de l'intégration Notion est le secret GitHub NOTION_CLE (jamais ici).
NOTION_SOURCE = "de823e47-5a0f-41b8-8d1e-513008d7cfca"
# Base « Rapports du matin » : un rapport par jour, affiché en direct sur le site.
NOTION_RAPPORTS = "b293d117-365a-4d10-a0de-9b0d0ff6a958"

# Sites autorisés à appeler le relais (séparés par des virgules).
ORIGINES = "https://ouzgane.github.io"

# Empreinte SHA-256 du jeton d'accès. Le jeton est dérivé du mot de passe du site
# dans le navigateur (PBKDF2, 310 000 itérations) : sans mot de passe, pas d'IA.
# Recalculer avec « node outils/empreinte-ia.mjs » si le mot de passe change.
JETON_EMPREINTE = "6ef0f110b6b13dd827e4bceb3744c6e50b819b450001792b6879eb8f54e4f106"
